version: '3.9'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ignis
      POSTGRES_USER: ignis
      POSTGRES_PASSWORD: ignis
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ignis']
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - '6333:6333'
      - '6334:6334'
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:6333/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  reranker:
    build:
      context: ./reranker
      dockerfile: Dockerfile
    ports:
      - '8001:8001'
    profiles:
      - reranker

volumes:
  pgdata:
  qdrant_data:
