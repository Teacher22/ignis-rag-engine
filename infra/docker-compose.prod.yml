version: '3.9'

# Production compose — extends infra/docker-compose.yml
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  # ── Infrastructure (inherited, kept as-is) ─────────────────────────────────
  postgres:
    restart: unless-stopped

  qdrant:
    restart: unless-stopped

  redis:
    restart: unless-stopped

  # ── API ────────────────────────────────────────────────────────────────────
  api:
    image: ghcr.io/${GITHUB_REPOSITORY}/ignis-api:${API_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env.prod
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3001/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Worker (same image, different entrypoint) ──────────────────────────────
  worker:
    image: ghcr.io/${GITHUB_REPOSITORY}/ignis-api:${API_IMAGE_TAG:-latest}
    command: ["node", "apps/api/dist/pipelines/ingestion.worker.js"]
    restart: unless-stopped
    env_file: .env.prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: 2   # two workers = parallel ingestion jobs

  # ── Web (Nginx + React SPA) ────────────────────────────────────────────────
  web:
    image: ghcr.io/${GITHUB_REPOSITORY}/ignis-web:${WEB_IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      - api
