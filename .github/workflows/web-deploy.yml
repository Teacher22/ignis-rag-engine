name: Web — Deploy to VM

on:
  workflow_run:
    workflows: ["Web — Build and push image"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (e.g. v1.0.3, sha-abc1234, latest)"
        required: false
        default: "latest"

jobs:
  deploy:
    name: Deploy to VM
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.image_tag }}" >> $GITHUB_OUTPUT
          else
            echo "value=sha-$(echo '${{ github.event.workflow_run.head_sha }}' | cut -c1-7)" >> $GITHUB_OUTPUT
          fi

      - name: SCP compose files to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key:      ${{ secrets.VM_SSH_KEY }}
          source:   "infra/docker-compose.yml,infra/docker-compose.prod.yml"
          target:   "~/ignis"

      - name: SSH → pull image + restart web
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key:      ${{ secrets.VM_SSH_KEY }}
          envs:     GHCR_TOKEN,IMAGE_TAG
          script: |
            set -e
            cd ~/ignis

            echo "$GHCR_TOKEN" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

            export WEB_IMAGE_TAG=$IMAGE_TAG
            export GITHUB_REPOSITORY=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')

            echo "▶ Deploying Web — image tag: $IMAGE_TAG"

            docker compose \
              -f infra/docker-compose.yml \
              -f infra/docker-compose.prod.yml \
              pull web

            docker compose \
              -f infra/docker-compose.yml \
              -f infra/docker-compose.prod.yml \
              up -d --no-deps web

            echo "✅ Web deployed — running: $IMAGE_TAG"
            docker ps --filter name=ignis-web --format '  container: {{.Names}}  status: {{.Status}}'
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          IMAGE_TAG:  ${{ steps.tag.outputs.value }}
