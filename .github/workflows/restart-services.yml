name: Manage Services

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform"
        required: true
        type: choice
        default: restart
        options:
          - restart
          - stop
          - start
      service:
        description: "Service to target"
        required: true
        type: choice
        default: all
        options:
          - all
          - api
          - worker
          - web

jobs:
  manage:
    name: "${{ inputs.action }} — ${{ inputs.service }}"
    runs-on: ubuntu-latest

    steps:
      - name: SSH → ${{ inputs.action }} ${{ inputs.service }}
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key:      ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e
            cd ~/ignis

            export GITHUB_REPOSITORY=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')

            COMPOSE="docker compose -f infra/docker-compose.yml -f infra/docker-compose.prod.yml"
            ACTION="${{ inputs.action }}"
            SERVICE="${{ inputs.service }}"

            if [ "$SERVICE" = "all" ]; then
              $COMPOSE $ACTION
            else
              $COMPOSE $ACTION $SERVICE
            fi

            echo "Done — current status:"
            $COMPOSE ps --format '  {{.Name}}: {{.Image}}  [{{.Status}}]'
