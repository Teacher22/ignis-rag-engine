name: Ignis App — Build and Deploy Unified Container

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - 'packages/shared/**'
      - 'infra/**'
      - 'Dockerfile'
      - '.github/workflows/app-build-deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - 'packages/shared/**'
      - 'Dockerfile'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Set to "true" to deploy to remote VM after building'
        required: true
        default: 'false'

env:
  REGISTRY: ghcr.io
  # Converts repository name to lowercase safely
  IMAGE_NAME: ${{ github.repository }}/ignis-app

jobs:
  build:
    name: Build & Push Unified Container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set lowercased image name
        run: |
          echo "IMAGE_NAME_LOWER=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production VM
    needs: build
    if: |
      github.event_name != 'pull_request' && 
      github.ref == 'refs/heads/main' && 
      (github.event_name == 'push' || github.event.inputs.deploy == 'true')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set lowercased image name and short SHA
        run: |
          echo "IMAGE_NAME_LOWER=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "SHORT_SHA=sha-$(echo '${{ github.sha }}' | cut -c1-7)" >> $GITHUB_ENV

      - name: SCP Orchestration files to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key:      ${{ secrets.VM_SSH_KEY }}
          source:   "infra/docker-compose.all-in-one.yml"
          target:   "~/ignis"

      - name: SSH → Pull and Restart Unified App
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key:      ${{ secrets.VM_SSH_KEY }}
          envs:     GHCR_TOKEN,IMAGE_NAME_LOWER,SHORT_SHA
          script: |
            set -e
            cd ~/ignis

            # Authenticate with GHCR
            echo "$GHCR_TOKEN" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

            # Set deployment environment variables
            export APP_IMAGE="ghcr.io/$IMAGE_NAME_LOWER:$SHORT_SHA"
            echo "▶ Deploying Unified App: $APP_IMAGE"

            # Pull and restart the app container side-by-side with decoupled infrastructure
            docker compose -f infra/docker-compose.all-in-one.yml pull app
            docker compose -f infra/docker-compose.all-in-one.yml up -d --no-deps app

            echo "Waiting for unified container to become healthy..."
            for i in $(seq 1 15); do
              # Nginx runs on port 80 and proxies healthcheck
              if curl -sf http://localhost/api/v1/health; then
                echo "✅ Ignis unified container is healthy and serving requests!"
                exit 0
              fi
              echo "Attempt $i/15 — retrying in 5s"
              sleep 5
            done
            echo "❌ Unified container failed to respond to healthcheck" && exit 1
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
