name: API — Deploy to VM

on:
  workflow_run:
    workflows: ["API — Build and push image"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (e.g. v1.0.3, sha-abc1234, latest)"
        required: false
        default: "latest"

jobs:
  deploy:
    name: Deploy to VM
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.image_tag }}" >> $GITHUB_OUTPUT
          else
            echo "value=sha-$(echo '${{ github.event.workflow_run.head_sha }}' | cut -c1-7)" >> $GITHUB_OUTPUT
          fi

      - name: SCP compose files to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key:      ${{ secrets.VM_SSH_KEY }}
          source:   "infra/docker-compose.yml,infra/docker-compose.prod.yml"
          target:   "~/ignis"

      - name: SSH → pull image + restart api & worker
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key:      ${{ secrets.VM_SSH_KEY }}
          envs:     GHCR_TOKEN,IMAGE_TAG
          script: |
            set -e
            cd ~/ignis

            echo "$GHCR_TOKEN" | docker login ghcr.io -u teacher22 --password-stdin

            export API_IMAGE_TAG=$IMAGE_TAG
            export GITHUB_REPOSITORY=${{ github.repository }}

            echo "▶ Deploying API — image tag: $IMAGE_TAG"

            docker compose \
              -f infra/docker-compose.yml \
              -f infra/docker-compose.prod.yml \
              pull api worker

            docker compose \
              -f infra/docker-compose.yml \
              -f infra/docker-compose.prod.yml \
              up -d --no-deps api worker

            echo "Waiting for API health..."
            for i in $(seq 1 12); do
              if curl -sf http://localhost:3001/health; then
                echo "✅ API is healthy — running: $IMAGE_TAG"
                exit 0
              fi
              echo "Attempt $i/12 — retrying in 5s"
              sleep 5
            done
            echo "❌ API failed to become healthy" && exit 1
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          IMAGE_TAG:  ${{ steps.tag.outputs.value }}
